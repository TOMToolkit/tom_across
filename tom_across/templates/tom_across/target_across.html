<div class="card">
    <div class="card-header">Observations</div>
    <div class="card-body" id="obs-table"
         hx-get="{% url 'across:observation-table' target.id %}"
         hx-trigger="load"
         hx-target="#obs-table"
         hx-swap="innerHTML">
        Loading Observations...
    </div>
</div>

<div class="card mt-3">
    <div class="card-header">Visibility</div>
    <div class="card-body" id="visibility-plot-wrapper"
         hx-get="{% url 'across:visibility-plot' target.id %}"
         hx-trigger="load"
         hx-target="#visibility-plot-wrapper"
         hx-swap="innerHTML">
        Loading visibility...
    </div>
</div>
