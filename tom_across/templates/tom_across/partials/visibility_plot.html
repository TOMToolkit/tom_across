{% load crispy_forms_tags %}

<div id="visibility-plot-wrapper">
    {{ plot_html|safe }}
</div>

<form hx-get="{% url 'tom_across:visibility-plot' target.id %}"
      hx-target="#visibility-plot-wrapper"
      hx-swap="innerHTML"
      hx-indicator="#plot-spinner"
      hx-disabled-elt="#update-btn"
      class="mb-3">
    {% crispy form %}
</form>
